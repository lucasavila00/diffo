name: Release Diffo

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET: x86_64-unknown-linux-gnu
      ASSET: diffo-x86_64-unknown-linux-gnu
      VERSION: ${{ github.ref_name }}
      DIFFO_RELEASE_VERSION: ${{ github.ref_name }}

    steps:
      - name: Check out immutable tag
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build production executable
        run: cargo build --locked --release --package diffo --target "${TARGET}"

      - name: Build schema-1 metadata and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${TARGET}/release/diffo" "dist/${ASSET}"
          length=$(stat --format=%s "dist/${ASSET}")
          digest=$(sha256sum "dist/${ASSET}" | cut -d ' ' -f1)
          jq -cn \
            --arg version "${VERSION}" \
            --arg name "${ASSET}" \
            --arg target "${TARGET}" \
            --arg sha256 "${digest}" \
            --argjson length "${length}" \
            '{schema:1,version:$version,assets:[{name:$name,length:$length,target:$target,sha256:$sha256}]}' \
            > dist/update-v1.json
          (cd dist && sha256sum "${ASSET}" update-v1.json > SHA256SUMS)

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Diffo ${VERSION}" \
            --generate-notes \
            --verify-tag \
            dist/diffo-x86_64-unknown-linux-gnu \
            dist/update-v1.json \
            dist/SHA256SUMS
