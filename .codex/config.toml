[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = '''if [ "$INSIDE_DEVCONTAINER" = "true" ]; then
  echo 'This session is running inside a devcontainer: an isolated, disposable Linux environment defined by .devcontainer/. Package installs and system-level changes are safe here and do not affect the host machine. This environment can run the full test suite just like CI, using the same commands CI uses.'
fi'''
