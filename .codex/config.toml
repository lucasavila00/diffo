[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = '''if [ "$INSIDE_DEVCONTAINER" = "true" ]; then
  echo 'This session is running inside a devcontainer: an isolated, disposable Linux environment defined by .devcontainer/. Package installs and system-level changes are safe here and do not affect the host machine. This environment can run the full test suite just like CI, using the same commands CI uses. The devcontainer has ag-git installed for pull or merge request, review, and CI operations on the current worktree branch; run ag-git help to see its supported commands. Use normal Git for commits, fetches, pulls, and pushes. The Git gateway requires branch names to use the current world prefix (for example, world df1 uses df1/); if it rejects a branch, rename it with git branch -m PREFIX/NAME.'
fi'''
