[workspace]
members = [
    "crates/diffo",
    "crates/diffo-app",
    "crates/diffo-core",
    "crates/diffo-diff",
    "crates/diffo-e2e",
    "crates/diffo-git",
    "crates/diffo-highlight",
    "crates/diffo-tui",
    "crates/diffo-watch",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
crossterm = "0.29"
diffo-core = { path = "crates/diffo-core" }
diffo-diff = { path = "crates/diffo-diff" }
diffo-app = { path = "crates/diffo-app" }
diffo-git = { path = "crates/diffo-git" }
diffo-highlight = { path = "crates/diffo-highlight" }
diffo-tui = { path = "crates/diffo-tui" }
diffo-watch = { path = "crates/diffo-watch" }
notify = "8.2"
portable-pty = "0.9"
ratatui = "0.29"
ron = "0.10"
serde = { version = "1.0", features = ["derive"] }
signal-hook = "0.3"
similar = "2.7"
tempfile = "3.20"
two-face = "0.5"
vt100 = "0.15"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
