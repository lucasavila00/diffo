[workspace]
members = [
    "crates/codex-mock",
    "crates/diffo",
    "crates/diffo-ai-config",
    "crates/diffo-app",
    "crates/diffo-core",
    "crates/diffo-diff",
    "crates/diffo-e2e",
    "crates/diffo-git",
    "crates/diffo-highlight",
    "crates/diffo-measure",
    "crates/diffo-ui",
    "crates/diffo-repository-service",
    "crates/diffo-update",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
crossterm = "0.29"
criterion = "0.7"
diffo-core = { path = "crates/diffo-core" }
diffo-diff = { path = "crates/diffo-diff" }
diffo-ai-config = { path = "crates/diffo-ai-config" }
diffo-app = { path = "crates/diffo-app" }
diffo-git = { path = "crates/diffo-git" }
diffo-highlight = { path = "crates/diffo-highlight" }
diffo-ui = { path = "crates/diffo-ui" }
diffo-repository-service = { path = "crates/diffo-repository-service" }
diffo-update = { path = "crates/diffo-update" }
insta = "1.48"
notify = "8.2"
nucleo-matcher = "0.3"
nix = { version = "0.28", features = ["process", "signal"] }
portable-pty = "0.9"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ron = "0.10"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.3"
similar = "2.7"
tempfile = "3.20"
two-face = "0.5"
vt100 = "0.15"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
